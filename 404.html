<!-- A crawler that lands here gets a 404 status and will not draw a preview
     card no matter what these say — real pages under /c/<slug>/ are what fix
     that (build-challenge-pages.mjs). These are the floor for the case a slug
     was never built: a generic card beats a bare URL. -->
<meta property="og:title" content="SideQuesting">
<meta property="og:description" content="Small quests, done daily. Free walking challenges with real prizes.">
<meta property="og:image" content="https://sidequesting.club/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>SideQuesting</title>
<script>
  // GitHub Pages serves only real files, so sidequesting.club/q/<slug> and
  // /c/<slug> — the addresses printed on share cards and forwarded into group
  // chats, because a human has to be able to type them — would otherwise 404.
  // Pages serves this file for unknown paths, so it forwards both shapes to
  // their real page and sends everything else home.
  (function () {
    var q = location.pathname.match(/^\/q\/([^\/?#]+)\/?$/);
    if (q) return location.replace('/q/?s=' + encodeURIComponent(q[1]));
    var c = location.pathname.match(/^\/c\/([^\/?#]+)\/?$/);
    if (c) return location.replace('/c/?s=' + encodeURIComponent(c[1]));
    location.replace('/');
  })();
</script>
<meta http-equiv="refresh" content="0; url=/">
</head>
